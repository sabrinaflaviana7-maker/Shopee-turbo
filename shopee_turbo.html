<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff5a00">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="manifest" href="./manifest.json">

  <title>Shopee Turbo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      padding-bottom: 80px;
    }

    header {
      background: linear-gradient(135deg, #ff5a00, #ff7a00);
      color: white;
      padding: 28px 20px;
      border-radius: 0 0 24px 24px;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 15px;
      opacity: .95;
    }

    .container {
      padding: 18px;
      max-width: 700px;
      margin: auto;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .section-title {
      font-size: 22px;
      margin: 8px 0 16px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
    }

    .card h3 {
      margin-bottom: 8px;
    }

    .card p {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      color: #ff5a00;
      margin: 10px 0;
    }

    .commission {
      display: inline-block;
      background: #fff1e8;
      color: #ff5a00;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 13px 16px;
      background: #ff5a00;
      color: white;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }

    button.secondary {
      background: #222;
    }

    input, select, textarea {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      background: white;
    }

    label {
      font-size: 13px;
      font-weight: bold;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat {
      background: white;
      border-radius: 14px;
      padding: 14px 8px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,.05);
    }

    .stat strong {
      display: block;
      font-size: 20px;
      color: #ff5a00;
      margin-bottom: 5px;
    }

    .stat span {
      font-size: 11px;
      color: #777;
    }

    .product-list {
      display: grid;
      gap: 12px;
    }

    .empty {
      text-align: center;
      padding: 30px 15px;
      color: #777;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: white;
      border-top: 1px solid #ddd;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      z-index: 1000;
    }

    .nav-btn {
      background: transparent;
      color: #777;
      border-radius: 0;
      margin: 0;
      padding: 7px 2px;
      font-size: 11px;
    }

    .nav-btn.active {
      color: #ff5a00;
      font-weight: bold;
    }

    .nav-icon {
      display: block;
      font-size: 20px;
      margin-bottom: 3px;
    }

    .content-box {
      background: #fff8f3;
      border: 1px solid #ffd8c2;
      border-radius: 14px;
      padding: 15px;
      margin-top: 12px;
      white-space: pre-line;
      line-height: 1.5;
      font-size: 14px;
    }

    .tag {
      display: inline-block;
      background: #eee;
      border-radius: 15px;
      padding: 5px 8px;
      margin: 3px;
      font-size: 12px;
    }

    .hero-card {
      background: linear-gradient(135deg, #222, #444);
      color: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .hero-card h2 {
      margin-bottom: 8px;
    }

    .hero-card p {
      color: #ddd;
    }

    .small {
      font-size: 12px;
      color: #777;
      margin-top: 8px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🛍️ Shopee Turbo</h1>
    <p>Encontre. Crie. Divulgue. Venda.</p>
  </header>

  <main class="container">

    <!-- INÍCIO -->
    <section id="inicio" class="view active">

      <div class="hero-card">
        <h2>🚀 Seu painel de afiliado</h2>
        <p>Organize produtos, crie conteúdos e acompanhe seus resultados.</p>
      </div>

      <div class="stats">
        <div class="stat">
          <strong id="homeProducts">0</strong>
          <span>Produtos</span>
        </div>

        <div class="stat">
          <strong>0</strong>
          <span>Cliques</span>
        </div>

        <div class="stat">
          <strong>R$ 0</strong>
          <span>Comissões</span>
        </div>
      </div>

      <h2 class="section-title">⚡ Acesso rápido</h2>

      <div class="card">
        <h3>🛒 Produtos</h3>
        <p>Cadastre e organize os produtos que você deseja divulgar.</p>
        <button onclick="showView('produtos')">Ver produtos</button>
      </div>

      <div class="card">
        <h3>✍️ Criar conteúdo</h3>
